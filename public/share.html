<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Correspondence</title>
</head>
<body>
    <header>
        <nav>
            <h1>Correspondence</h1>
            <svg id="logout" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
            </svg>
        </nav>
    </header>

    <main>
        <section>
            <div id="file-list"></div>
        </section>

        <section>
            <div class="menu">
                <div class="button-menu">
                    <button class="btn" id="sortBtn">A → Z</button>
                    <button class="btn" id="filterBtn">My Files</button>
                </div>
                <div class="button-menu">
                    <input type="file" id="fileInput">
                    <button class="btn btn-dark" id="uploadBtn">Upload</button>
                </div>
                <p id="confirm"></p>
            </div>
        </section>
    </main>

    <script src="js/share.js"></script>
</body>
</html>
